[package]
name = "spoutpeak-watch-server"
version = "0.2.0"
edition = "2024"
description = "Spoutpeak watch-together relay (HTTP + WebSocket)"
publish = false

# Its own workspace: built on its own (and in Docker) without the app.
[workspace]

[[bin]]
name = "watch-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde_json = "1.0.154"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
