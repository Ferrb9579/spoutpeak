[package]
name = "spoutpeak-watch-server"
version = "0.2.0"
edition = "2024"
description = "Spoutpeak watch-together relay (HTTP + WebSocket)"
publish = false

# Its own workspace: built on its own (and in Docker) without the app.
[workspace]

[[bin]]
name = "watch-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "ws", "json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde_json = "1.0.154"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-postgres = "0.7"
argon2 = "0.6.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
refinery = { version = "0.10.0", default-features = false, features = ["tokio-postgres"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
