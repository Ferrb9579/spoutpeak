[package]
name = "spoutpeak"
version = "0.1.0"
edition = "2024"
description = "A native addon-based media center built with Incular"

[dependencies]
incular = "0.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rodio = { version = "0.20", default-features = false }
dirs = "6"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
# SVG path parsing for the Lucide icon set (same version Incular renders with).
kurbo = "0.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
