[package]
name = "spoutpeak"
version = "0.1.0"
edition = "2024"
default-run = "spoutpeak"
description = "A native, addon-based media center built with Incular"

[dependencies]
incular = "0.1.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
resvg = { version = "0.45.1", default-features = false }
rodio = { version = "0.20", default-features = false }
dirs = "6"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
# SVG path parsing for the bundled Solar and MingCute icons.
kurbo = "0.13"
# Built-in torrent streaming engine.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
# Watch-together room connection (wss://).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
# Size on disk of sparse torrent files (the cache limit). Same version
# librqbit already uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
resvg = { version = "0.45.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# librqbit with stream priorities: playback pieces before read-ahead, no
# shuffled stream windows, early steals of the pieces a reader waits on.
# See patches/README.md.
[patch.crates-io]
librqbit = { path = "patches/librqbit" }
