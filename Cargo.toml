[package]
name = "spoutpeak"
version = "0.1.0"
edition = "2024"
default-run = "spoutpeak"
description = "A native, addon-based media center built with Incular"

[dependencies]
incular = "0.1.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
resvg = { version = "0.50.0", default-features = false }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
dirs = "7.0.0"
urlencoding = "2.1.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
open = "5.4.5"
# SVG path parsing for the bundled Solar and MingCute icons.
kurbo = "0.13.1"
# Built-in torrent streaming engine.
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-util = { version = "0.7.20", features = ["io"] }
# Watch-together room connection (wss://).
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"

[target.'cfg(windows)'.dependencies]
# Size on disk of sparse torrent files (the cache limit). Same version
# librqbit already uses.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[build-dependencies]
resvg = { version = "0.50.0", default-features = false }

[dev-dependencies]
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# librqbit with stream priorities: playback pieces before read-ahead, no
# shuffled stream windows, early steals of the pieces a reader waits on.
# See patches/README.md.
[patch.crates-io]
librqbit = { path = "patches/librqbit" }
