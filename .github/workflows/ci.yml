name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'
  SPOUTPEAK_WATCH_URL: ${{ vars.SPOUTPEAK_WATCH_URL }}

jobs:
  desktop:
    name: Desktop / ${{ matrix.name }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libudev-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers xvfb xauth \
            patchelf desktop-file-utils squashfs-tools rpm
      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Check
        run: cargo clippy --locked --release --all-targets
      - name: Test
        run: cargo test --locked --release --all-targets
      - name: Build
        run: cargo build --locked --release --bin spoutpeak
      - name: Test packaging scripts
        run: python -m unittest discover -s ci -p "test_*.py" -v
      - name: Package and verify
        run: python ci/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Linux packaged app startup
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SPOUTPEAK_SCRIPT: 'wait:5;shot:linux-startup;exit'
          SPOUTPEAK_SHOT_DIR: target/ci-shots
          XDG_RUNTIME_DIR: /tmp/spoutpeak-ci-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Use the extracted AppImage, including its packaged libraries.
          xvfb-run -a timeout 45s target/package/linux/extracted/squashfs-root/AppRun
          test -s target/ci-shots/linux-startup.png
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spoutpeak-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload startup evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-startup
          path: target/ci-shots/*
          if-no-files-found: ignore

  watch-server:
    name: Watch server
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: watch-server -> target
          key: watch-server
      - run: cargo clippy --manifest-path watch-server/Cargo.toml --locked --release --all-targets
      - run: cargo test --manifest-path watch-server/Cargo.toml --locked --release --all-targets
      - run: cargo build --manifest-path watch-server/Cargo.toml --locked --release
      - name: Test health endpoint
        run: python ci/smoke_server.py
